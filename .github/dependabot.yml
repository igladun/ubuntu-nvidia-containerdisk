version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current; Dependabot bumps the pin and the
  # trailing "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # One grouped PR per run so same-repo actions (e.g. codeql-action init/analyze)
    # bump together instead of failing CI one at a time.
    groups:
      github-actions:
        patterns:
          - "*"
